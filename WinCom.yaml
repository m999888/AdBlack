# =========================================================
# Nikki / Clash Meta / Mihomo 配置文件
# =========================================================

mode: rule
mixed-port: 7897
allow-lan: false
log-level: info
ipv6: false
external-controller: ''
secret: set-your-secret
unified-delay: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fdfe:dcba:9876::1/64
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 2400:3200::1
    - '2402:4e00::'
  direct-nameserver-follow-policy: true # 严格跟随直连策略，防止直连 DNS 走错路
fake-ip-filter:
  # 1. 局域网与本地设备
  - '*.lan'
  - '*.local'
  - '*.arpa'
  - 'localhost.*'
  - '*.home.arpa'
  - '+.local.mesh'
  - 'localhost.ptlogin2.qq.com'
  # 2. 时间同步（NTP）与基础连通性检查
  - 'ntp.*.com'
  - 'time.*.com'
  - '*.msftncsi.com'
  - '*.msftconnecttest.com'
  - 'connectivitycheck.gstatic.com'
  - 'detectportal.firefox.com'
  - 'cp.cloudflare.com'
  # 3. Apple 关键同步、推送与门禁
  - 'captive.apple.com'
  - '+.apple-dns.net'
  - '+.push.apple.com'
  - 'ocsp.apple.com'
  - 'ocsp2.apple.com'
  - 'valid.apple.com'
  - '+.mask.icloud.com'
  - '+.mask-h2.icloud.com'
  - '+.mask-api.icloud.com'
  - 'p*-cloudkit.icloud.com'
  - 'p*-keyvalueservice.icloud.com'
  - 'gateway.icloud.com'
  - 'metrics.icloud.com'
  # 4. 常见路由器后台与局域网服务
  - '+.router.asus.com'
  - '+.routerlogin.net'
  - '+.tplinkwifi.net'
  - '+.miwifi.com'
  - '+.peiluyou.com'
  - '+.fitbox.home'
  - '+.market.xiaomi.com'
  - '+.plex.direct'
  # 5. 游戏联机与 P2P / STUN 打洞服务
  - '+.stun.*.*'
  - '+.stun.*.*.*'
  - '+.stun.*.*.*.*'
  - '+.turn.*.*'
  - '+.turn.*.*.*'
  - '+.xboxlive.com'

faked-ip-filter-mode: blacklist
fallback:
- 'https://1.1.1.1/dns-query#✈️ 节点选择'
- 'https://8.8.8.8/dns-query#✈️ 节点选择'
- 'https://[2606:4700:4700::1111]/dns-query#✈️ 节点选择'
- 'https://dns64.dns.google/dns-query#✈️ 节点选择'
fallback-filter:
  domain:
    - +.google.com
    - +.facebook.com
    - +.youtube.com
  geoip: true
  geoip-code: CN
  ipcidr:
    - 240.0.0.0/4
    - 0.0.0.0/32
listen: :53
nameserver:
    - 'https://223.5.5.5/dns-query'
    - 'https://doh.pub/dns-query'
    - 'https://1.1.1.1/dns-query#✈️ 节点选择'
    - 'https://8.8.8.8/dns-query#✈️ 节点选择'
    - 'https://[2606:4700:4700::1111]/dns-query#✈️ 节点选择'
    - 'https://dns64.dns.google/dns-query#✈️ 节点选择'
prefer-h3: true
proxy-server-nameserver:
  - 'https://1.1.1.1/dns-query'
  - 'https://8.8.8.8/dns-query'
respect-rules: true #（遵循分流规则）
use-system-hosts: false #（不读取系统 Hosts 文件）

profile:
  store-selected: true
# ---------------------------------------------------------
# 高性能 TUN 虚拟网卡配置
# ---------------------------------------------------------
tun:
  enable: true
  stack: mixed
  device: Winbox
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  mtu: 1500
  route-exclude-address: []
proxies: []
proxy-providers:                     # 在此处填写你的代理节点信息，或通过 Clash 客户端自动合并 Profile
  Airport_Subscription:
    type: http
    # 请在下方填入你重置后的新订阅链接
    url: "https://mitce.io/modules/servers/v2Net/subscribe/?sid=473135&token=bc25a780a305b6dc8a59&app=clashverge"
    interval: 86400
    path: ./providers/airport.yaml
    exclude-filter: (官|网站|地址|过期|到期|剩余|流量|重置|联系|客服|群|订阅|续费|测试|专线|公告|提示)
    health-check:
      enable: true
      interval: 300
      url: https://www.gstatic.com/generate_204

