;设置分组标志

enable_rule_generator=true             #开启后，系统/脚本会自动根据预设模板或线上规则集（如 GeoIP、ACL4SSR、Loyalsoldier 规则库等），为你的订阅配置动态生成完整的规则列表（Rules），而无需你手动逐条编写分流规则

overwrite_original_rules=true          #true（开启）：如果你的机场或订阅链接本身自带了一些分流规则，系统生成新规则时会彻底删掉并替换原有规则，只保留规则生成器产生的规则。
                                       #false（关闭）：通常会把生成的规则追加（合并）到原订阅规则的头部或尾部。
enable_cache=false
#含义：启用缓存（当前已被注释掉，即禁用该设置）。
#前面的 # 表示注释（该行代码被暂停生效），系统会按照默认逻辑处理。
#如果把 # 去掉并设为 false，代表禁用缓存。系统每次更新或拉取配置时，都会强行重新获取和解析远端资源，而不使用本地之前存好的缓存数据。
#提示：开启缓存 (enable_cache=true) 可以大幅提升订阅更新速度并减少网络请求；如果规则更新不及时，再临时改回 false

skip_failed_links=true           # 将 skip_failed_links=false 改为了 true：当部分外部规则库 GitHub 链接偶尔被墙拉不下来时，不会导致整个订阅更新失败。
                                       
