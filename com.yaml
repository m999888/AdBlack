# =========================================================
# Nikki / Clash Meta / Mihomo 配置文件
# =========================================================

mode: rule
mixed-port: 7897
allow-lan: false
log-level: info
ipv6: false
external-controller: ''
secret: set-your-secret
unified-delay: true
dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
  - 1.12.12.12
  - 223.5.5.5
  direct-nameserver-follow-policy: true
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - '*.arpa'
  - 'time.*.com'
  - 'ntp.*.com'
  - 'time.*.com'
  - '+.market.xiaomi.com'
  - localhost.ptlogin2.qq.com
  - '*.msftncsi.com'
  - www.msftconnecttest.com
  fake-ip-filter-mode: blacklist
  fake-ip-range6: fdfe:dcba:9876::1/64
  fallback-filter:
    domain:
    - +.google.com
    - +.facebook.com
    - +.youtube.com
    geoip: true
    geoip-code: CN
    ipcidr:
    - 240.0.0.0/4
    - 0.0.0.0/32
  listen: :53
  nameserver:
  - https://1.12.12.12/dns-query
  - https://dns.alidns.com/dns-query
  prefer-h3: true
  proxy-server-nameserver:
  - https://1.12.12.12/dns-query
  - https://dns.alidns.com/dns-query
  - tls://223.5.5.5
  respect-rules: true
  use-system-hosts: false
external-controller-pipe: \\.\pipe\verge-mihomo-sidecar-release-173d532e85ff0d0202bdc38d4b0b0cd4ee33349fe3265fcdbd2849eafac8b00f
profile:
  store-selected: true

# ---------------------------------------------------------
# 高性能 TUN 虚拟网卡配置
# ---------------------------------------------------------
tun:
  enable: true
  stack: mixed                 # 推荐 mixed，兼顾速度与稳定性
  device: Mihomo
  auto-route: true
  auto-detect-interface: true
  strict-route: true           # 开启严格路由，防止流量绕过代理泄露
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  mtu: 1500
  route-exclude-address: []

proxies: []
proxy-providers:                     # 在此处填写你的代理节点信息，或通过 Clash 客户端自动合并 Profile
  Airport_Subscription:
    type: http
    # 请在下方填入你重置后的新订阅链接
    url: "https://cyberguard.cfd/api/v1/client/subscribe?token=eb3b359f1ee661f4bd045afab7318c87"
    interval: 86400
    path: ./providers/airport.yaml
    exclude-filter: (官网|网站|地址|过期|到期|剩余|流量|重置|联系|客服|群|订阅|续费|测试|专线|公告|提示)
    health-check:
      enable: true
      interval: 600
      url: http://www.gstatic.com/generate_204

